# Ejemplo de permisos para NX_ServerDoctor. Copia lo que necesites a tu server.cfg.
# Los identificadores son de ejemplo: cámbialos por los tuyos.

# Permiso del comando /nxcheck para el grupo de administración
add_ace group.admin nxdoctor.use allow

# Añadir a una persona al grupo de administración
# add_principal identifier.license:0000000000000000000000000000000000000000 group.admin

# NUNCA hagas esto: daría el comando a todos los jugadores
# add_ace builtin.everyone nxdoctor.use allow
